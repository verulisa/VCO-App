<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#151b10" />
    <meta name="description" content="Unofficial fan-made offline companion app for the Vegan Camp Out festival — lineup, schedule, food and map. Not affiliated with or endorsed by the festival organisers." />
    <meta property="og:title" content="Vegan Camp Out (Unofficial Fan App)" />
    <meta property="og:description" content="Unofficial, fan-made offline companion for the festival — lineup, schedule, food and map. Not affiliated with or endorsed by Vegan Camp Out." />
    <meta property="og:image" content="https://verulisa.github.io/VCO-App/brand/logo.jpg" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="icons/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VCO" />
    <title>Vegan Camp Out — Unofficial Fan App</title>
    <style>
      /* Inline so this paints immediately on first open (or a slow reload),
         instead of a blank/black gap while the JS bundle loads. This sits
         OUTSIDE #root (React never touches it) and main.jsx fades it out
         itself, with a minimum display time — see the comment there for why
         a plain instant removal looked like a glitchy flash. Background
         matches the manifest's background_color so there's no colour jump
         from the OS's own launch splash either. */
      #vco-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #151b10;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #vco-splash.vco-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #vco-splash img {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        animation: vco-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes vco-splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        #vco-splash img { animation: none; }
      }
    </style>
    <script>
      // GitHub Pages only ever serves the latest build — it doesn't keep old
      // hashed JS/CSS files around after a new deploy. If a browser is still
      // holding an older cached copy of this HTML (from before a deploy) its
      // <script type="module"> tag points at a bundle filename that no
      // longer exists, the fetch 404s, nothing ever renders, and all that's
      // left on screen is this page's plain background colour — a "blank
      // screen" with no error visible to the user. Catch that one failure
      // and force a real reload (once per tab) to fetch the current shell.
      (function () {
        try {
          if (sessionStorage.getItem("vco-stale-reload")) return;
        } catch (e) {}
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT" && e.target.type === "module") {
              try {
                sessionStorage.setItem("vco-stale-reload", "1");
              } catch (e) {}
              location.reload();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="bg-[--vco-bg] text-[--vco-text]">
    <div id="root"></div>
    <div id="vco-splash" aria-hidden="true">
      <img src="icons/apple-touch-icon.png" alt="" width="84" height="84" />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
