<svg width="1400" height="1751" viewBox="0 0 1400 1751" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .zone { stroke: #0e1209; stroke-width: 3; stroke-linejoin: round; }
      .amenity { fill: #f2ede0; stroke: #12160f; stroke-width: 2; }
      .amenity-txt { fill: #12160f; font-size: 18px; font-weight: 800; text-anchor: middle; }
    </style>

    <!-- Simple original pictograms (not copied from any real map) so the
         eye has actual landmarks to recognise — a tent, a stall, a stage —
         instead of only flat colour + text. -->
    <symbol id="ico-tent" viewBox="0 0 60 50">
      <path d="M30,2 L58,46 L2,46 Z" fill="#e4dcc0" stroke="#12160f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M30,2 L30,46" stroke="#12160f" stroke-width="2"/>
      <path d="M30,22 L22,46 M30,22 L38,46" stroke="#12160f" stroke-width="2"/>
    </symbol>
    <symbol id="ico-bigtop" viewBox="0 0 70 56">
      <path d="M35,2 L66,50 L4,50 Z" fill="#d6553f" stroke="#12160f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M35,2 L35,50 M18,50 L35,20 L52,50" stroke="#f2ede0" stroke-width="3.5" fill="none"/>
      <circle cx="35" cy="2" r="3" fill="#12160f"/>
    </symbol>
    <symbol id="ico-belltent" viewBox="0 0 60 50">
      <path d="M30,2 C10,10 6,46 6,46 L54,46 C54,46 50,10 30,2 Z" fill="#ede3c8" stroke="#12160f" stroke-width="2.5"/>
      <circle cx="30" cy="2" r="3" fill="#12160f"/>
    </symbol>
    <symbol id="ico-hut" viewBox="0 0 44 40">
      <rect x="6" y="20" width="32" height="18" fill="#7a5233" stroke="#12160f" stroke-width="2"/>
      <path d="M0,20 L22,4 L44,20 Z" fill="#5c3a22" stroke="#12160f" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-van" viewBox="0 0 70 40">
      <rect x="2" y="10" width="66" height="22" rx="6" fill="#e8e4d8" stroke="#12160f" stroke-width="2.5"/>
      <rect x="6" y="14" width="18" height="10" rx="2" fill="#7fa8c9"/>
      <circle cx="18" cy="34" r="6" fill="#12160f"/>
      <circle cx="54" cy="34" r="6" fill="#12160f"/>
    </symbol>
    <symbol id="ico-car" viewBox="0 0 56 32">
      <rect x="2" y="10" width="52" height="14" rx="6" fill="#5a6470" stroke="#12160f" stroke-width="2.5"/>
      <path d="M14,10 L20,2 L38,2 L44,10 Z" fill="#5a6470" stroke="#12160f" stroke-width="2.5" stroke-linejoin="round"/>
