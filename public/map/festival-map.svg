      <circle cx="44" cy="26" r="5.5" fill="#12160f"/>
    </symbol>
    <symbol id="ico-stage" viewBox="0 0 70 50">
      <rect x="8" y="30" width="54" height="16" fill="#2b2b2b" stroke="#12160f" stroke-width="2.5"/>
      <rect x="4" y="6" width="10" height="30" fill="#1c1c1c" stroke="#12160f" stroke-width="2"/>
      <rect x="56" y="6" width="10" height="30" fill="#1c1c1c" stroke="#12160f" stroke-width="2"/>
      <line x1="14" y1="8" x2="56" y2="8" stroke="#12160f" stroke-width="2.5"/>
      <circle cx="35" cy="20" r="6" fill="#eeb43a"/>
    </symbol>
